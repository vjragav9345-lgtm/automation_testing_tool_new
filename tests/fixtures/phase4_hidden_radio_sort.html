<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Hidden Radio Sort Fixture (Myntra-style)</title>
<style>
  body { margin: 0; font-family: sans-serif; padding: 40px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 4px 0; }
  label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  /* the real Myntra pattern: a native radio input with NO visible box at
     all (display:none, matching a zero layout box) - the visible thing
     is purely the label's own text plus a custom ::before indicator. */
  input[type="radio"] { display: none; }
</style>
</head>
<body>
  <ul>
    <li>
      <label>
        <input type="radio" name="sort" value="price_asc"> Price: Low to High
      </label>
    </li>
    <li>
      <label>
        <input type="radio" name="sort" value="price_desc"> Price: High to Low
      </label>
    </li>
  </ul>
  <script>
    document.querySelectorAll('input[name="sort"]').forEach(function (el) {
      el.addEventListener('change', function () {
        document.title = 'SORT_' + this.value.toUpperCase();
      });
    });
  </script>
</body>
</html>
